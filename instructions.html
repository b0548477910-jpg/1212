<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הוראות המשחקים — טריוויה</title>
<style>
  :root {
    --bg:#07071a;--s1:#0f0f22;--s2:#161630;
    --gold:#f5c842;--green:#22c55e;--red:#ef4444;
    --text:#f0f0ff;--muted:#8080b0;--border:rgba(255,255,255,0.08);
  }
  * { box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text); font-family:'Rubik',Arial,sans-serif;
    margin:0; padding:20px; min-height:100vh;
  }
  .topbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  h1 { font-size:1.5rem; margin:0 0 4px; color:var(--gold); }
  .sub { color:var(--muted); font-size:0.88rem; margin-bottom:6px; }
  .btn {
    background:var(--s2); color:var(--text); border:1px solid var(--border); border-radius:9px;
    padding:9px 16px; font-size:0.9rem; cursor:pointer; font-family:inherit;
  }
  .btn:hover { border-color:var(--gold); }
  .search {
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--s1); color:var(--text); font-family:inherit; font-size:0.95rem; margin-bottom:18px;
  }
  .search::placeholder { color:var(--muted); }
  .card {
    background:var(--s1); border:1px solid var(--border); border-radius:14px;
    margin-bottom:12px; overflow:hidden;
  }
  .card-head {
    padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:12px;
    justify-content:space-between; user-select:none;
  }
  .card-head:hover { background:rgba(255,255,255,0.02); }
  .card-title { display:flex; align-items:center; gap:12px; }
  .card-icon { font-size:1.6rem; }
  .card-name { font-weight:800; font-size:1.05rem; }
  .card-tagline { color:var(--muted); font-size:0.82rem; margin-top:2px; }
  .chevron { color:var(--muted); font-size:1.1rem; transition:transform 0.2s; }
  .card.open .chevron { transform:rotate(180deg); }
  .card-body { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .card.open .card-body { max-height:1200px; }
  .card-body-inner { padding:0 18px 18px; border-top:1px solid var(--border); padding-top:14px; }
  .card-body-inner p { margin:0 0 10px; line-height:1.7; font-size:0.93rem; }
  .card-body-inner ul { margin:0 0 10px; padding-inline-start:22px; line-height:1.8; font-size:0.93rem; }
  .badge-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .badge { background:var(--s2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:0.78rem; color:var(--muted); }
  .badge b { color:var(--text); }
  .section-label { font-size:0.9rem; }
  .group-title { color:var(--gold); font-size:1.1rem; font-weight:800; margin:26px 0 12px; padding-right:4px; }
  .group-title:first-of-type { margin-top:4px; }
  .empty-msg { text-align:center; color:var(--muted); padding:30px; display:none; }
</style>
</head>

function renderGames() {
  const container = document.getElementById('gamesList');
  container.innerHTML = '';
  GROUPS.forEach(group => {
    const gt = document.createElement('div');
    gt.className = 'group-title';
    gt.textContent = group.title;
    gt.dataset.groupTitle = '1';
    container.appendChild(gt);
    group.games.forEach(g => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.searchKey = (g.name + ' ' + g.tagline).toLowerCase();
      card.innerHTML = `
        <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
          <div class="card-title">
            <div class="card-icon">${g.icon}</div>
            <div>
              <div class="card-name">${g.name}</div>
              <div class="card-tagline">${g.tagline}</div>
            </div>
          </div>
          <div class="chevron">▾</div>
        </div>
        <div class="card-body"><div class="card-body-inner">
          <div class="badge-row">${g.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
          ${g.body}
        </div></div>`;
      container.appendChild(card);
    });
  });
}

function filterGames() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  let anyVisible = false;
  cards.forEach(c => {
    const match = !q || c.dataset.searchKey.includes(q);
    c.style.display = match ? '' : 'none';
    if (match) anyVisible = true;
  });
  document.querySelectorAll('[data-group-title]').forEach(gt => {
    // הצג כותרת קבוצה רק אם יש בה לפחות כרטיס גלוי אחד
    let el = gt.nextElementSibling, hasVisible = false;
    while (el && !el.dataset.groupTitle) {
      if (el.style.display !== 'none') hasVisible = true;
      el = el.nextElementSibling;
    }
    gt.style.display = hasVisible ? '' : 'none';
  });
  document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
}

renderGames();
